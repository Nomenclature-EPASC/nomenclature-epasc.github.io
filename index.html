<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carte interactive</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        #toolbar {
            height: 55px;
            background: #eeeeee;
            border-bottom: 1px solid #cccccc;

            display: flex;
            align-items: center;
            gap: 8px;

            padding: 8px 12px;
        }

        button {
            padding: 7px 14px;
            font-size: 14px;
            cursor: pointer;
        }

        #map-container {
            position: absolute;
            top: 55px;
            bottom: 0;
            left: 0;
            right: 0;

            overflow: hidden;
            background: #dddddd;

            cursor: grab;
        }

        #map-container:active {
            cursor: grabbing;
        }

        #map {
            position: absolute;
            left: 0;
            top: 0;

            transform-origin: 0 0;
        }

        #plan {
            display: block;
            max-width: none;
            user-select: none;
            pointer-events: none;
        }
    </style>
</head>

<body>

    <div id="toolbar">
        <button onclick="zoomIn()">＋</button>
        <button onclick="zoomOut()">−</button>
        <button onclick="resetView()">Réinitialiser</button>
    </div>

    <div id="map-container">

        <div id="map">
            <img id="plan" src="plan.png">
        </div>

    </div>

<script>

let scale = 1;
let offsetX = 0;
let offsetY = 0;

let dragging = false;

let startX;
let startY;

let startOffsetX;
let startOffsetY;

const container = document.getElementById("map-container");
const map = document.getElementById("map");


// ------------------------------
// AFFICHER LA CARTE
// ------------------------------

function updateMap() {

    map.style.transform =
        `translate(${offsetX}px, ${offsetY}px) scale(${scale})`;

}


// ------------------------------
// ZOOM
// ------------------------------

function zoomAt(x, y, factor) {

    const oldScale = scale;

    scale *= factor;

    scale = Math.max(0.1, Math.min(scale, 10));

    const realFactor = scale / oldScale;

    offsetX =
        x - (x - offsetX) * realFactor;

    offsetY =
        y - (y - offsetY) * realFactor;

    updateMap();

}


// ------------------------------
// BOUTONS
// ------------------------------

function zoomIn() {

    const rect = container.getBoundingClientRect();

    zoomAt(
        rect.width / 2,
        rect.height / 2,
        1.3
    );

}


function zoomOut() {

    const rect = container.getBoundingClientRect();

    zoomAt(
        rect.width / 2,
        rect.height / 2,
        1 / 1.3
    );

}


function resetView() {

    scale = 1;

    offsetX = 0;
    offsetY = 0;

    updateMap();

}


// ------------------------------
// MOLETTE
// ------------------------------

container.addEventListener("wheel", function(event) {

    event.preventDefault();

    const rect =
        container.getBoundingClientRect();

    const x =
        event.clientX - rect.left;

    const y =
        event.clientY - rect.top;

    const factor =
        event.deltaY < 0 ? 1.15 : 1 / 1.15;

    zoomAt(x, y, factor);

}, { passive: false });


// ------------------------------
// DÉPLACEMENT
// ------------------------------

container.addEventListener("mousedown", function(event) {

    dragging = true;

    startX = event.clientX;
    startY = event.clientY;

    startOffsetX = offsetX;
    startOffsetY = offsetY;

});


window.addEventListener("mousemove", function(event) {

    if (!dragging) return;

    offsetX =
        startOffsetX +
        (event.clientX - startX);

    offsetY =
        startOffsetY +
        (event.clientY - startY);

    updateMap();

});


window.addEventListener("mouseup", function() {

    dragging = false;

});


// ------------------------------
// INITIALISATION
// ------------------------------

updateMap();

</script>

</body>
</html>
