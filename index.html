<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Carte interactive</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        /* BARRE DU HAUT */

        #toolbar {
            height: 55px;

            background: #eeeeee;
            border-bottom: 1px solid #cccccc;

            display: flex;
            align-items: center;
            gap: 8px;

            padding: 8px 12px;

            position: relative;
            z-index: 10;
        }

        button {
            padding: 7px 14px;

            font-size: 14px;

            border: 1px solid #aaaaaa;
            border-radius: 4px;

            background: white;

            cursor: pointer;
        }

        button:hover {
            background: #dddddd;
        }


        /* ZONE DE LA CARTE */

        #map-container {

            position: absolute;

            top: 55px;
            left: 0;
            right: 0;
            bottom: 0;

            overflow: hidden;

            background: #dddddd;

            cursor: grab;
        }

        #map-container:active {
            cursor: grabbing;
        }


        /* PLAN */

        #map {

            position: absolute;

            left: 0;
            top: 0;

            transform-origin: 0 0;

        }

        #plan {

            display: block;

            max-width: none;

            user-select: none;

            pointer-events: none;

        }

    </style>
</head>


<body>


<!-- BARRE D'OUTILS -->

<div id="toolbar">

    <button onclick="zoomIn()">＋</button>

    <button onclick="zoomOut()">−</button>

    <button onclick="resetView()">
        Réinitialiser
    </button>

</div>


<!-- CARTE -->

<div id="map-container">

    <div id="map">

        <img
            id="plan"
            src="2026-09_Nomenclature.png"
        >

    </div>

</div>


<script>


/* ==========================================
   VARIABLES
========================================== */


let scale = 1;

let offsetX = 0;

let offsetY = 0;


let dragging = false;

let startX;

let startY;

let startOffsetX;

let startOffsetY;


const container =
    document.getElementById("map-container");

const map =
    document.getElementById("map");


/* ==========================================
   AFFICHER LA CARTE
========================================== */


function updateMap() {

    map.style.transform =
        `translate(${offsetX}px, ${offsetY}px) scale(${scale})`;

}


/* ==========================================
   ZOOM AUTOUR D'UN POINT
========================================== */


function zoomAt(x, y, factor) {

    const oldScale = scale;


    scale *= factor;


    /* Limites du zoom */

    scale =
        Math.max(
            0.1,
            Math.min(scale, 10)
        );


    const realFactor =
        scale / oldScale;


    /* Conserver le point sous la souris */

    offsetX =
        x -
        (x - offsetX) *
        realFactor;


    offsetY =
        y -
        (y - offsetY) *
        realFactor;


    updateMap();

}


/* ==========================================
   BOUTON +
========================================== */


function zoomIn() {

    const rect =
        container.getBoundingClientRect();


    zoomAt(

        rect.width / 2,

        rect.height / 2,

        1.3

    );

}


/* ==========================================
   BOUTON -
========================================== */


function zoomOut() {

    const rect =
        container.getBoundingClientRect();


    zoomAt(

        rect.width / 2,

        rect.height / 2,

        1 / 1.3

    );

}


/* ==========================================
   RÉINITIALISER
========================================== */


function resetView() {

    scale = 1;

    offsetX = 0;

    offsetY = 0;


    updateMap();

}


/* ==========================================
   MOLETTE
========================================== */


container.addEventListener(
    "wheel",
    function(event) {

        event.preventDefault();


        const rect =
            container.getBoundingClientRect();


        const x =
            event.clientX -
            rect.left;


        const y =
            event.clientY -
            rect.top;


        const factor =
            event.deltaY < 0
                ? 1.15
                : 1 / 1.15;


        zoomAt(
            x,
            y,
            factor
        );

    },
    {
        passive: false
    }
);


/* ==========================================
   CLIQUER / DÉPLACER LE PLAN
========================================== */


container.addEventListener(
    "mousedown",
    function(event) {

        dragging = true;


        startX =
            event.clientX;


        startY =
            event.clientY;


        startOffsetX =
            offsetX;


        startOffsetY =
            offsetY;

    }
);


/* ==========================================
   DÉPLACEMENT
========================================== */


window.addEventListener(
    "mousemove",
    function(event) {

        if (!dragging)
            return;


        offsetX =
            startOffsetX +
            (
                event.clientX -
                startX
            );


        offsetY =
            startOffsetY +
            (
                event.clientY -
                startY
            );


        updateMap();

    }
);


/* ==========================================
   FIN DU DÉPLACEMENT
========================================== */


window.addEventListener(
    "mouseup",
    function() {

        dragging = false;

    }
);


/* ==========================================
   ADAPTER AUTOMATIQUEMENT LE PLAN
========================================== */

function fitPlanToWindow() {

    const planWidth = plan.naturalWidth;
    const planHeight = plan.naturalHeight;

    const windowWidth = container.clientWidth;
    const windowHeight = container.clientHeight;


    const scaleX =
        windowWidth / planWidth;

    const scaleY =
        windowHeight / planHeight;


    /* On prend le plus petit pour que
       tout le plan soit visible */

    scale =
        Math.min(scaleX, scaleY);


    /* Petite marge autour du plan */

    scale *= 0.95;


    /* Centrer le plan */

    offsetX =
        (windowWidth -
        planWidth * scale) / 2;


    offsetY =
        (windowHeight -
        planHeight * scale) / 2;


    updateMap();

}


/* ==========================================
   INITIALISATION
========================================== */


if (plan.complete) {

    fitPlanToWindow();

} else {

    plan.addEventListener(
        "load",
        fitPlanToWindow
    );

}


/* ==========================================
   ADAPTER SI LA FENÊTRE CHANGE DE TAILLE
========================================== */

window.addEventListener(
    "resize",
    fitPlanToWindow
);


</script>

</body>
</html>
