<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Carte interactive</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        #toolbar {
            height: 55px;
            background: #eeeeee;
            border-bottom: 1px solid #cccccc;

            display: flex;
            align-items: center;
            gap: 8px;

            padding: 8px 12px;

            position: relative;
            z-index: 100;
        }

        button {
            padding: 7px 14px;
            font-size: 14px;
            cursor: pointer;
        }

        #map-container {
            position: absolute;
            top: 55px;
            left: 0;
            right: 0;
            bottom: 0;

            overflow: hidden;
            background: #dddddd;

            cursor: grab;
        }

        #map-container:active {
            cursor: grabbing;
        }

        #map {
            position: absolute;
            left: 0;
            top: 0;

            transform-origin: 0 0;
        }

        #plan {
            display: block;
            max-width: none;
            user-select: none;
            pointer-events: none;
        }

        /* NUMÉROS */

        #markers {
            position: absolute;
            left: 0;
            top: 0;

            width: 100%;
            height: 100%;

            pointer-events: none;
        }

        .marker {
            position: absolute;

            transform: translate(-50%, -50%);

            min-width: 30px;
            height: 30px;

            padding: 4px 7px;

            background: white;
            border: 2px solid black;
            border-radius: 50%;

            display: flex;
            align-items: center;
            justify-content: center;

            font-weight: bold;
            font-size: 14px;

            pointer-events: auto;
        }
    </style>
</head>

<body>

<div id="toolbar">

    <button id="loginButton" onclick="login()">
    🔐 Connexion
</button>

<button id="logoutButton"
        onclick="logout()"
        style="display:none;">
    🚪 Déconnexion
</button>

    <span id="adminStatus"></span>

    <button onclick="zoomIn()">＋</button>

    <button onclick="zoomOut()">−</button>

    <button onclick="resetView()">
        Réinitialiser
    </button>

</div>


<div id="map-container">

    <div id="map">

        <img
            id="plan"
            src="2026-09_Nomenclature.png"
        >

        <div id="markers"></div>

    </div>

</div>


<script>

/* =====================================================
   SUPABASE
===================================================== */


/*
    REMPLACE UNIQUEMENT LES DEUX VALEURS CI-DESSOUS.

    Ne mets PAS de clé "secret" ou "service_role".
*/

const SUPABASE_URL =
    "https://wcdhghogvargjwsvljzy.supabase.co/";

const SUPABASE_KEY =
    "sb_publishable_HEkxwYdy0DEcfRK7YOz-IA_q4iG31-J";

    const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


async function login() {

    const email =
        prompt("Adresse e-mail administrateur :");

    if (!email)
        return;


    const password =
        prompt("Mot de passe :");

    if (!password)
        return;


    const { data, error } =
        await supabaseClient.auth.signInWithPassword({
            email: email,
            password: password
        });


    if (error) {

        alert(
            "Erreur de connexion : " +
            error.message
        );

        return;
    }


    updateLoginStatus();

}


async function logout() {

    await supabaseClient.auth.signOut();

    updateLoginStatus();

}


async function updateLoginStatus() {

    const { data } =
        await supabaseClient.auth.getUser();


    const loggedIn =
        !!data.user;

    editMode = loggedIn;

document.querySelectorAll(".marker").forEach(function(marker) {

    marker.style.background =
        editMode ? "#ffff00" : "white";

    marker.style.cursor =
        editMode ? "move" : "default";


    marker.onmousedown = function(event) {

        if (!editMode) {
            return;
        }

        event.stopPropagation();

    };

});

    document.getElementById(
        "loginButton"
    ).style.display =
        loggedIn ? "none" : "inline-block";


    document.getElementById(
        "logoutButton"
    ).style.display =
        loggedIn ? "inline-block" : "none";


    document.getElementById(
        "adminStatus"
    ).textContent =
        loggedIn
            ? "✏️ MODE ÉDITION"
            : "";

}


updateLoginStatus();


/* =====================================================
   VARIABLES
===================================================== */

let editMode = false;
    
let scale = 1;

let offsetX = 0;

let offsetY = 0;


let dragging = false;

let startX;

let startY;

let startOffsetX;

let startOffsetY;


const container =
    document.getElementById("map-container");

const map =
    document.getElementById("map");

const plan =
    document.getElementById("plan");

const markers =
    document.getElementById("markers");


/* =====================================================
   AFFICHAGE
===================================================== */

function updateMap() {

    map.style.transform =
        `translate(${offsetX}px, ${offsetY}px) scale(${scale})`;

}


/* =====================================================
   ZOOM
===================================================== */

function zoomAt(x, y, factor) {

    const oldScale = scale;

    scale *= factor;

    scale =
        Math.max(
            0.1,
            Math.min(scale, 10)
        );

    const realFactor =
        scale / oldScale;

    offsetX =
        x - (x - offsetX) * realFactor;

    offsetY =
        y - (y - offsetY) * realFactor;

    updateMap();

}


function zoomIn() {

    const rect =
        container.getBoundingClientRect();

    zoomAt(
        rect.width / 2,
        rect.height / 2,
        1.3
    );

}


function zoomOut() {

    const rect =
        container.getBoundingClientRect();

    zoomAt(
        rect.width / 2,
        rect.height / 2,
        1 / 1.3
    );

}


/* =====================================================
   ADAPTER LE PLAN
===================================================== */

function fitPlanToWindow() {

    const planWidth =
        plan.naturalWidth;

    const planHeight =
        plan.naturalHeight;

    const windowWidth =
        container.clientWidth;

    const windowHeight =
        container.clientHeight;


    const scaleX =
        windowWidth / planWidth;

    const scaleY =
        windowHeight / planHeight;


    scale =
        Math.min(scaleX, scaleY) * 0.95;


    offsetX =
        (windowWidth -
        planWidth * scale) / 2;


    offsetY =
        (windowHeight -
        planHeight * scale) / 2;


    updateMap();

}


function resetView() {

    fitPlanToWindow();

}


/* =====================================================
   SOURIS
===================================================== */

container.addEventListener(
    "wheel",
    function(event) {

        event.preventDefault();

        const rect =
            container.getBoundingClientRect();

        const x =
            event.clientX - rect.left;

        const y =
            event.clientY - rect.top;

        const factor =
            event.deltaY < 0
                ? 1.15
                : 1 / 1.15;

        zoomAt(x, y, factor);

    },
    {
        passive: false
    }
);


container.addEventListener(
    "mousedown",
    function(event) {

        dragging = true;

        startX = event.clientX;
        startY = event.clientY;

        startOffsetX = offsetX;
        startOffsetY = offsetY;

    }
);


window.addEventListener(
    "mousemove",
    function(event) {

        if (!dragging)
            return;

        offsetX =
            startOffsetX +
            event.clientX -
            startX;

        offsetY =
            startOffsetY +
            event.clientY -
            startY;

        updateMap();

    }
);


window.addEventListener(
    "mouseup",
    function() {

        dragging = false;

    }
);


/* =====================================================
   CHARGER LES NUMÉROS DEPUIS SUPABASE
===================================================== */

async function loadNumbers() {

    const url =
        SUPABASE_URL +
        "/rest/v1/numeros?select=*";


    try {

        const response =
            await fetch(
                url,
                {
                    headers: {
                        "apikey":
                            SUPABASE_KEY,

                        "Authorization":
                            "Bearer " +
                            SUPABASE_KEY
                    }
                }
            );


        if (!response.ok) {

            throw new Error(
                "Erreur Supabase : " +
                response.status
            );

        }


        const data =
            await response.json();


        console.log(
            "Numéros chargés :",
            data
        );


        displayNumbers(data);


    } catch (error) {

        console.error(
            "Impossible de charger les numéros :",
            error
        );

    }

}


/* =====================================================
   AFFICHER LES NUMÉROS
===================================================== */

function displayNumbers(data) {

    markers.innerHTML = "";


    data.forEach(function(item) {

        const marker =
            document.createElement("div");


        marker.className =
            "marker";

marker.style.cursor =
    editMode ? "move" : "default";

if (editMode) {
    marker.style.background = "#ffff00";

    marker.addEventListener("mousedown", function(event) {

        event.stopPropagation();

        marker.dataset.dragging = "true";

    });
}

        marker.textContent =
            item.numero;


        marker.style.left =
            item.x + "px";


        marker.style.top =
            item.y + "px";


        markers.appendChild(
            marker
        );

    });

}


/* =====================================================
   INITIALISATION
===================================================== */

if (plan.complete) {

    fitPlanToWindow();

} else {

    plan.addEventListener(
        "load",
        fitPlanToWindow
    );

}


window.addEventListener(
    "resize",
    fitPlanToWindow
);


loadNumbers();

</script>

</body>
</html>
