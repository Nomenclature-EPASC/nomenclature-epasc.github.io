async function updateLoginStatus() {

    const { data } =
        await supabaseClient.auth.getUser();


    const loggedIn =
        !!data.user;

    editMode = loggedIn;

document.querySelectorAll(".marker").forEach(function(marker) {

    marker.style.background =
        editMode ? "#ffff00" : "white";

        editMode ? "move" : "default";


marker.onpointerdown = function(event) {

    if (!editMode) {
        return;
    }

    event.preventDefault();
    event.stopPropagation();

    marker.setPointerCapture(event.pointerId);

    const startX = event.clientX;
    const startY = event.clientY;

    const startLeft =
        parseFloat(marker.style.left);

    const startTop =
        parseFloat(marker.style.top);


    function move(e) {

        const dx =
            (e.clientX - startX) / scale;

        const dy =
            (e.clientY - startY) / scale;


        marker.style.left =
            (startLeft + dx) + "px";

        marker.style.top =
            (startTop + dy) + "px";

    }


async function stop() {

    marker.releasePointerCapture(event.pointerId);

    marker.onpointermove = null;

const newY =

console.log(

try {

"Authorization":

"Prefer":

if (!response.ok) {

}


    marker.onpointermove = move;

};

updateLoginStatus();

let editMode = false;

function startAddingTerrainPlant() {

    console.log("Mode ajout activé");

    container.style.cursor = "crosshair";

    function placePoint(event) {

        const rect =
            container.getBoundingClientRect();

        const x =

            "terrain-marker-new";

            x + "px";

            y + "px";

markers.appendChild(point);

let pointDragging = false;
let pointStartX = 0;
let pointStartY = 0;
let pointStartLeft = x;
let pointStartTop = y;

point.addEventListener("pointerdown", function(event) {

    event.preventDefault();
    event.stopPropagation();

    pointDragging = true;

    pointStartX = event.clientX;
    pointStartY = event.clientY;

    pointStartLeft =
        parseFloat(point.style.left);

    pointStartTop =
        parseFloat(point.style.top);

    point.setPointerCapture(event.pointerId);
});

point.addEventListener("pointermove", function(event) {

    if (!pointDragging) {
        return;
    }

    const dx =
        (event.clientX - pointStartX) / scale;

    const dy =
        (event.clientY - pointStartY) / scale;

    point.style.left =
        (pointStartLeft + dx) + "px";

    point.style.top =
        (pointStartTop + dy) + "px";
});

point.addEventListener("pointerup", function(event) {

});

container.style.cursor = "grab";

        container.removeEventListener(

        );

        console.log(
            "Point créé :",

        );

}

let scale = 1;

let offsetX = 0;

let offsetY = 0;


let dragging = false;

let startX;

let startY;

let startOffsetX;

let startOffsetY;


const container =
    document.getElementById("map-container");

const map =
    document.getElementById("map");

const plan =
    document.getElementById("plan");

const markers =
    document.getElementById("markers");


/* =====================================================
   AFFICHAGE
===================================================== */

function hidePlantInfo() {

    const info =
        document.getElementById("plantInfo");

    if (info) {
        info.style.display = "none";
    }

}


function updateMap() {

    hidePlantInfo();

    map.style.transform =
        `translate(${offsetX}px, ${offsetY}px) scale(${scale})`;

   

}

    container.addEventListener(
    "click",
    function(event) {

        if (!event.target.closest(".marker")) {

            hidePlantInfo();

        }

    }
);


/* =====================================================
   ZOOM
===================================================== */

function zoomAt(x, y, factor) {

    console.log("zoomAt appelé, scale AVANT :", scale, offsetX, offsetY);

    const oldScale = scale;

    scale *= factor;

    scale =
        Math.max(
            0.01,
            Math.min(scale, 10)
        );

    const realFactor =
        scale / oldScale;

    offsetX =
        x - (x - offsetX) * realFactor;

    offsetY =
        y - (y - offsetY) * realFactor;

    updateMap();

}


function zoomIn() {

    const rect =
        container.getBoundingClientRect();

    zoomAt(
        rect.width / 2,
        rect.height / 2,
        1.3
    );

}


function zoomOut() {

    const rect =
        container.getBoundingClientRect();

    zoomAt(
        rect.width / 2,
        rect.height / 2,
        1 / 1.3
    );

}


/* =====================================================
   ADAPTER LE PLAN
===================================================== */

function fitPlanToWindow() {

    const planWidth =
        plan.naturalWidth;

    const planHeight =
        plan.naturalHeight;

    const windowWidth =
        container.clientWidth;

    const windowHeight =
        container.clientHeight;


    const scaleX =
        windowWidth / planWidth;

    const scaleY =
        windowHeight / planHeight;


scale = Math.min(scaleX, scaleY);

offsetX = (windowWidth - planWidth * scale) / 2;
offsetY = (windowHeight - planHeight * scale) / 2;

updateMap();

    console.log("fitPlanToWindow →", {
    scale, offsetX, offsetY,
    naturalWidth: plan.naturalWidth,
    naturalHeight: plan.naturalHeight,
    clientWidth: container.clientWidth,
    clientHeight: container.clientHeight
});

}


function resetView() {

    fitPlanToWindow();

}


/* =====================================================
   SOURIS
===================================================== */

container.addEventListener(
    "wheel",
    function(event) {

        event.preventDefault();

        const rect =
            container.getBoundingClientRect();

        const x =
            event.clientX - rect.left;

        const y =
            event.clientY - rect.top;

        const factor =
            event.deltaY < 0
                ? 1.15
                : 1 / 1.15;

        zoomAt(x, y, factor);

    },
    {
        passive: false
    }
);


container.addEventListener(
    "mousedown",
    function(event) {

        dragging = true;

        startX = event.clientX;
        startY = event.clientY;

        startOffsetX = offsetX;
        startOffsetY = offsetY;

    }
);


window.addEventListener(
    "mousemove",
    function(event) {

        if (!dragging)
            return;

        offsetX =
            startOffsetX +
            event.clientX -
            startX;

        offsetY =
            startOffsetY +
            event.clientY -
            startY;

        updateMap();

    }
);


window.addEventListener(
    "mouseup",
    function() {

        dragging = false;

    }
);

/* =====================================================
   TACTILE
===================================================== */

let touchMode = null;

let touchStartX = 0;
let touchStartY = 0;

let touchStartOffsetX = 0;
let touchStartOffsetY = 0;


let pinchStartDistance = 0;

let pinchStartScale = 1;

let pinchStartOffsetX = 0;
let pinchStartOffsetY = 0;

let pinchStartCenterX = 0;
let pinchStartCenterY = 0;

let pinchNeedsInit = false;




/* =====================================================
   TOUCHSTART
===================================================== */

container.addEventListener(
    "touchstart",
    function(event) {


        /* UN DOIGT */

        if (event.touches.length === 1) {

            const touch =
                event.touches[0];

            touchMode = "pan";

            touchStartX =
                touch.clientX;

            touchStartY =
                touch.clientY;

            touchStartOffsetX =
                offsetX;

            touchStartOffsetY =
                offsetY;

        }


        /* DEUX DOIGTS */
if (event.touches.length === 2) {

    touchMode = "pinch";

    pinchNeedsInit = true;

}

    },
    {
        passive: false
    }
);


/* =====================================================
   TOUCHMOVE
===================================================== */

container.addEventListener(
    "touchmove",
    function(event) {

        event.preventDefault();


        /* ==========================================
           UN DOIGT → DÉPLACER LA CARTE
        ========================================== */

        if (
            event.touches.length === 1 &&
            touchMode === "pan"
        ) {

            const touch =
                event.touches[0];


            offsetX =
                touchStartOffsetX +
                touch.clientX -
                touchStartX;


            offsetY =
                touchStartOffsetY +
                touch.clientY -
                touchStartY;


            updateMap();

        }


        /* ==========================================
           DEUX DOIGTS → PINCH
        ========================================== */

        if (
            event.touches.length === 2 &&
            touchMode === "pinch"
        ) {

            const touch1 =
                event.touches[0];

            const touch2 =
                event.touches[1];


            /* Distance actuelle */

            const dx =
                touch2.clientX -
                touch1.clientX;

            const dy =
                touch2.clientY -
                touch1.clientY;


            const distance =
                Math.hypot(dx, dy);




const rect =
    container.getBoundingClientRect();

const centerX =
    (
        touch1.clientX +
        touch2.clientX
    ) / 2 -
    rect.left;

const centerY =
    (
        touch1.clientY +
        touch2.clientY
    ) / 2 -
    rect.top;


if (pinchNeedsInit) {

    pinchStartDistance = distance;

    pinchStartCenterX = centerX;
    pinchStartCenterY = centerY;

    pinchStartScale = scale;

    pinchStartOffsetX = offsetX;
    pinchStartOffsetY = offsetY;

    pinchNeedsInit = false;

    return;

}


if (
    pinchStartDistance <= 0
) {

    return;

}


const factor =
    distance /
    pinchStartDistance;



            


            /*
               On applique le zoom progressivement
               à partir du SCALE ACTUEL.
            */

let newScale =
    pinchStartScale *
    factor;


            newScale =
                Math.max(
                    0.01,
                    Math.min(
                        newScale,
                        10
                    )
                );


const realFactor =
    newScale /
    pinchStartScale;


            /*
               Même principe que zoomAt()
            */

offsetX =
    pinchStartOffsetX +
    (
        centerX -
        pinchStartCenterX
    ) -
    (
        pinchStartCenterX -
        pinchStartOffsetX
    ) *
    (
        realFactor - 1
    );


offsetY =
    pinchStartOffsetY +
    (
        centerY -
        pinchStartCenterY
    ) -
    (
        pinchStartCenterY -
        pinchStartOffsetY
    ) *
    (
        realFactor - 1
    );

            scale =
                newScale;


            /*
               IMPORTANT :
               on remet la distance de référence
               à la distance actuelle.
            */




            updateMap();

        }

    },
    {
        passive: false
    }
);


/* =====================================================
   TOUCHEND
===================================================== */

container.addEventListener(
    "touchend",
    function(event) {

        /* PLUS DE DOIGTS */

if (
    event.touches.length === 0
) {

    touchMode = null;

    pinchStartDistance = 0;



}


        /* UN DOIGT RESTANT */

        if (
            event.touches.length === 1
        ) {

            const touch =
                event.touches[0];


            touchMode = "pan";


            touchStartX =
                touch.clientX;

            touchStartY =
                touch.clientY;


            touchStartOffsetX =
                offsetX;

            touchStartOffsetY =
                offsetY;

        }

    },
    {
        passive: false
    }
);

 let allPlants = [];

function displayTerrainPlants(data) {

    data.forEach(function(item) {

        if (
            item.x === null ||
            item.y === null
        ) {
            return;
        }

        const marker =
            document.createElement("div");

        marker.className =
            "terrain-marker";

        marker.dataset.id =
            item.id;

        marker.style.left =
            item.x + "px";

        marker.style.top =
            item.y + "px";

        marker.addEventListener(
            "click",
            function(event) {

                event.stopPropagation();

                showTerrainPlantInfo(
                    item,
                    marker
                );

            }
        );

        markers.appendChild(marker);

    });

}

        "fixed";

    info.style.left =
        (
            rect.left +
            rect.width / 2 -
            info.offsetWidth / 2
        ) + "px";

    info.style.top =
        (
            rect.bottom +
            10
        ) + "px";

}

    info.style.position = "fixed";

info.style.left =
    (rect.left + rect.width / 2 - info.offsetWidth / 2) + "px";

info.style.top =
    (rect.bottom + 10) + "px";
}
function displayNumbers(data) {

    markers.innerHTML = "";


    data.forEach(function(item) {
        
        if (item.x === null || item.y === null) {
    return;
}

        const marker =
            document.createElement("div");


        marker.className =
            "marker";

        marker.dataset.id =
    item.id;

marker.style.cursor =
    editMode ? "move" : "default";

marker.textContent =
    item.numero;

let lastMarkerClick = 0;

marker.addEventListener("click", function(event) {

    if (now - lastMarkerClick < 400) {

        }, 100);

    } else {

        showPlantInfo(item, marker);

    }

    lastMarkerClick = now;

});


        marker.style.left =
            item.x + "px";


        marker.style.top =
            item.y + "px";


        markers.appendChild(
            marker
        );

    });

}

   INITIALISATION
===================================================== */

function fitPlanToWindowAndReveal() {

    fitPlanToWindow();

    map.style.opacity = "1";

}


if (plan.complete) {

    fitPlanToWindowAndReveal();

} else {

    plan.addEventListener(
        "load",
        fitPlanToWindowAndReveal
    );

}


window.addEventListener(
    "resize",
    function() {

        // Sur GSM, ne pas refaire le zoom automatique
        // lors de l'ouverture/fermeture du clavier.
        if (window.innerWidth <= 600) {
            return;
        }

        fitPlanToWindow();

    }
);


loadNumbers();
loadTerrainPlants();

if ("serviceWorker" in navigator) {

    let refreshing = false;

    navigator.serviceWorker.addEventListener(
        "controllerchange",
        function() {

            if (!refreshing) {

                refreshing = true;

                window.location.reload();

            }

        }
    );

    navigator.serviceWorker.register("./sw.js", {
        updateViaCache: "none"
    })
    .then(function(registration) {

        registration.update();

    })
    .catch(function(error) {

        console.error("Erreur service worker :", error);

    });


    // Vérifier le Service Worker lorsque la PWA redevient visible
    document.addEventListener("visibilitychange", function() {

        if (document.visibilityState === "visible") {

            navigator.serviceWorker.ready.then(function(registration) {

                registration.update();

            });

        }

    });

}


</script>
